<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stashday</title>
<meta name="application-name" content="Stashday">
<meta name="apple-mobile-web-app-title" content="Stashday">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="Stashday: plan your month, send the rest to savings, and see which payday gets you to your goal. Private, no account, works offline.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f0; --card:#ffffff; --ink:#15171c; --muted:#6a6f78; --line:#e6e3dc;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#e0f1ee;
  --warn:#a85a07; --warn-soft:#fdf0dc; --bad:#b42318; --bad-soft:#fde7e5;
  --track:#ece9e2; --shadow:0 1px 2px rgba(20,20,20,.04),0 4px 16px rgba(20,20,20,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1012; --card:#171a1e; --ink:#eceef1; --muted:#99a0a9; --line:#272b31;
    --accent:#2cc5b0; --accent-ink:#06201c; --accent-soft:#11302b;
    --warn:#f2a33a; --warn-soft:#33230d; --bad:#f2786d; --bad-soft:#3a1715;
    --track:#23272d; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 96px}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
header h1{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--accent)} .dot.warn{background:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px}
.big{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.mid{font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.bar{height:10px;background:var(--track);border-radius:99px;overflow:hidden;margin:12px 0 8px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.note{border-radius:12px;padding:10px 12px;font-size:14px;margin-top:12px}
.note.ok{background:var(--accent-soft)} .note.warn{background:var(--warn-soft)} .note.bad{background:var(--bad-soft)}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 6px}
input.in,select.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;outline:none;min-width:0}
input.in:focus,select.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.amount-in{font-size:30px;font-weight:800;letter-spacing:-.02em;text-align:center;padding:14px}
.list{margin:0;padding:0;list-style:none}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.emoji{width:34px;height:34px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.grow{flex:1;min-width:0}
.ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.plus{color:var(--accent)}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 6px;border-radius:8px}
.x:hover{background:var(--bg)}
.itemrow{display:grid;grid-template-columns:48px 1fr 96px 30px;gap:8px;align-items:center;margin-top:8px}
.itemrow input{padding:9px 10px}
.itemrow .em{text-align:center}
.planrow{display:grid;grid-template-columns:1fr 88px 124px 30px;gap:8px;align-items:center;margin-top:8px}
.planrow input{padding:9px 10px}
.sum{display:flex;justify-content:space-between;padding:6px 0;font-variant-numeric:tabular-nums}
.sum.total{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700;font-size:17px}
.good{color:var(--accent)} .badc{color:var(--bad)}
.eq{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:end;gap:6px;text-align:center;margin-top:6px}
.eq .op{font-size:20px;color:var(--muted);padding-bottom:16px}
.eq .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.eq .l{font-size:12px;color:var(--muted)}
.eq .save .v{color:var(--accent)}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.monthnav b{font-size:17px}
.monthnav button{border:1px solid var(--line);background:var(--bg);border-radius:10px;width:36px;height:36px;cursor:pointer;font-size:18px}
.tl{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
.tl .r{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-variant-numeric:tabular-nums;font-size:14px}
.tl .r .lbl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.muted{background:var(--bg);color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:0;background:transparent;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:10}
.overlay.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px 22px;max-height:90vh;overflow:auto;animation:up .2s ease}
@media(min-width:600px){.overlay{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:18px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%)}
.loading{text-align:center;padding:60px 0;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:18px 0 6px;font-size:14px}
.phone{display:flex;gap:14px;align-items:center}
.phone svg{flex:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Stashday</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Loading…</span></div>
  </header>
  <main id="view"><div class="loading">Loading…</div></main>
</div>

<nav class="tabs"><div class="in" id="tabs">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-tab="month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Month</button>
  <button data-tab="savings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>Savings</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</div></nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* Stashday — how it works:
   Each month: pay − what you plan to spend = what you send to savings.
   Savings = starting money + every transfer you send + extra adds − anything you take out.
   Everything is stored in this browser only (localStorage). */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayISO = () => isoOf(new Date());
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; };
const sumOf = (arr, f) => arr.reduce((a, x) => a + f(x), 0);
const r2 = n => Math.round(n * 100) / 100;

const GENERIC_LIST = [
  { id: 't1', emoji: '🍜', name: 'Food & drinks', amount: 0 },
  { id: 't2', emoji: '⛽', name: 'Transport', amount: 0 },
  { id: 't3', emoji: '📱', name: 'Phone & internet', amount: 0 },
  { id: 't4', emoji: '📺', name: 'Subscriptions', amount: 0 },
  { id: 't5', emoji: '🎉', name: 'Fun', amount: 0 }
];
// list kept for people who used the app before it had a setup screen
const LEGACY_LIST = [
  { id: 't1', emoji: '☕', name: 'Coffee', amount: 77.5 },
  { id: 't2', emoji: '⛽', name: 'Gas', amount: 15 },
  { id: 't3', emoji: '❤️', name: 'Date', amount: 60 },
  { id: 't4', emoji: '📺', name: 'YouTube / Phone / Spotify', amount: 15 },
  { id: 't5', emoji: '💈', name: 'Haircut / bike maintenance', amount: 7.5 }
];
const TEMPLATE = () => (S.template || GENERIC_LIST).map(i => ({ ...i }));
const DEFAULT = () => ({
  v: 3,
  currency: 'USD',
  payDay: 5,
  income: 0,
  started: false,
  template: null,
  startBalance: 0,
  startDate: null,
  goal: { name: '', price: 0, targetMonth: '' },
  big: [],
  months: {},   // 'YYYY-MM' -> { pay, items:[{id,emoji,name,amount}], received }
  moves: []     // { id, date, t, type: 'transfer'|'add'|'out', amount, note, month }
});

let S = DEFAULT();
let loaded = false, tab = 'home', viewMonth = null;

const CURRENCIES = [['USD','US dollar'],['KHR','Cambodian riel'],['EUR','Euro'],['GBP','British pound'],['THB','Thai baht'],['VND','Vietnamese dong'],['PHP','Philippine peso'],['IDR','Indonesian rupiah'],['MYR','Malaysian ringgit'],['SGD','Singapore dollar'],['INR','Indian rupee'],['AUD','Australian dollar'],['CAD','Canadian dollar'],['JPY','Japanese yen'],['KRW','South Korean won'],['CNY','Chinese yuan']];
const NO_CENTS = ['KHR','VND','IDR','JPY','KRW'];
function fmt(n) {
  n = n || 0;
  const c = S.currency || 'USD', a = Math.abs(n), sign = n < 0 ? '−' : '';
  if (c === 'KHR') return sign + Math.round(a).toLocaleString('en') + ' ៛';
  const cents = !NO_CENTS.includes(c) && r2(a) % 1 ? 2 : 0;
  try { return sign + new Intl.NumberFormat('en', { style: 'currency', currency: c, currencyDisplay: 'narrowSymbol', minimumFractionDigits: cents, maximumFractionDigits: cents }).format(cents ? r2(a) : Math.round(a)); }
  catch (e) { return sign + a.toLocaleString('en') + ' ' + c; }
}
const currencyOptions = sel => CURRENCIES.map(([k, n]) => `<option value="${k}" ${sel === k ? 'selected' : ''}>${n} (${k})</option>`).join('');

/* ---------- months (a month runs from one payday to the next) ---------- */
function cycleOf(d) { let [y, m, day] = d.split('-').map(Number); if (day < S.payDay) { m--; if (m < 1) { m = 12; y--; } } return y + '-' + pad(m); }
function addMonths(k, n) { let [y, m] = k.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return y + '-' + pad(m); }
const monthsBetween = (a, b) => { const [ay, am] = a.split('-').map(Number), [by, bm] = b.split('-').map(Number); return (by - ay) * 12 + (bm - am); };
const monthName = (k, o = { month: 'long', year: 'numeric' }) => { const [y, m] = k.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleString('en', o); };
const payDate = k => { const [y, m] = k.split('-').map(Number); return new Date(y, m - 1, S.payDay); };
const shortDate = d => d.toLocaleDateString('en', { day: 'numeric', month: 'short' });
function niceDay(iso) {
  const [y, m, d] = iso.split('-').map(Number); const t = new Date(); const yd = new Date(); yd.setDate(yd.getDate() - 1);
  if (iso === isoOf(t)) return 'Today'; if (iso === isoOf(yd)) return 'Yesterday';
  return new Date(y, m - 1, d).toLocaleDateString('en', { day: 'numeric', month: 'short', year: 'numeric' });
}
const curMonth = () => cycleOf(todayISO());

/* The list for a month: its own if you've set one, else a copy of the latest earlier month (or the starter list). */
function inheritedItems(k) {
  const keys = Object.keys(S.months).filter(x => x <= k).sort();
  const src = keys.length ? S.months[keys[keys.length - 1]].items : null;
  return src ? src.map(i => ({ ...i })) : TEMPLATE();
}
function monthData(k) {
  const m = S.months[k];
  if (m) return { pay: m.pay ?? S.income, items: m.items, received: !!m.received, catchUp: m.catchUp || 0, done: !!m.done, own: true };
  return { pay: S.income, items: inheritedItems(k), received: false, catchUp: 0, done: false, own: false };
}
function ensureMonth(k) {
  if (!S.months[k]) S.months[k] = { pay: S.income, items: inheritedItems(k), received: false };
  return S.months[k];
}
const spendOf = k => sumOf(monthData(k).items, i => i.amount || 0);
const saveOf = k => monthData(k).pay - spendOf(k);
const toSendOf = k => saveOf(k) + monthData(k).catchUp;
const sentIn = k => sumOf(S.moves.filter(m => m.type === 'transfer' && m.month === k), m => m.amount);
const bigIn = k => sumOf(S.big.filter(b => b.month === k), b => b.amount || 0);

/* ---------- savings ---------- */
function balanceNow() {
  return S.startBalance
    + sumOf(S.moves.filter(m => m.type !== 'out'), m => m.amount)
    - sumOf(S.moves.filter(m => m.type === 'out'), m => m.amount);
}
/* Savings on each upcoming payday, once that month's transfer is sent. */
function projection() {
  const price = S.goal.price || 0, cur = curMonth(), target = S.goal.targetMonth || null;
  let B = balanceNow(), reach = null; const rows = [];
  const horizon = Math.max(target ? monthsBetween(cur, target) : 0, 2);
  for (let i = 0; i <= 36; i++) {
    const k = addMonths(cur, i);
    const pending = monthData(k).done ? 0 : Math.max(0, toSendOf(k) - sentIn(k));
    B += (i === 0 ? pending : saveOf(k)) - bigIn(k);
    rows.push({ k, bal: B, late: i === 0 && !monthData(k).received, done: i === 0 && pending === 0 && sentIn(k) > 0, start: i === 0 && monthData(k).done && sentIn(k) === 0 });
    if (price && !reach && B >= price) reach = k;
    if (i >= horizon && (reach || !price)) break;
  }
  return { rows, reach, target, tRow: target ? rows.find(r => r.k === target) : null };
}

/* ---------- storage: this device only ---------- */
const LKEY = 'stashday.v3';
function setStatus(t, kind) { $('#status').textContent = t; $('#dot').className = 'dot ' + (kind || ''); }
function hydrate(o) { const s = Object.assign(DEFAULT(), o || {}); s.goal = Object.assign(DEFAULT().goal, (o && o.goal) || {}); return s; }
function save() { try { localStorage.setItem(LKEY, JSON.stringify(S)); setStatus('Saved on this device', 'ok'); } catch (e) { setStatus('Can’t save here — use Back up', 'warn'); } }
function boot() {
  try {
    const raw = localStorage.getItem(LKEY);
    if (raw) { S = hydrate(JSON.parse(raw)); if (!S.template && S.started) { S.template = LEGACY_LIST.map(i => ({ ...i })); save(); } }
    else {
      // carry over the few things worth keeping from the earlier version
      const old = JSON.parse(localStorage.getItem('foldfund.v2') || 'null');
      if (old) {
        Object.assign(S, { currency: old.currency || 'USD', payDay: old.payDay || 5, income: old.income || 700, started: !!old.started, startBalance: old.startBalance || 0, startDate: old.startDate || null });
        if (old.goal) S.goal = Object.assign(S.goal, old.goal);
        if (Array.isArray(old.planned)) S.big = old.planned.map(p => ({ id: p.id, name: p.name, amount: p.amount, month: p.month }));
        S.template = LEGACY_LIST.map(i => ({ ...i }));
        save();
      }
    }
  } catch (e) {}
  loaded = true; setStatus('Saved on this device', 'ok'); render();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {});
}
function backup() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'stashday-backup-' + todayISO() + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function restore(file) {
  const r = new FileReader();
  r.onload = () => { try { const o = JSON.parse(r.result); if (!o || o.v !== 3) throw 0; S = hydrate(o); save(); render(); toast('Backup restored'); } catch (e) { toast('That file isn’t a Stashday backup'); } };
  r.readAsText(file);
}

/* ---------- UI helpers ---------- */
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 1800); }
function openSheet(html) { $('#sheet').innerHTML = html; $('#overlay').classList.add('open'); const f = $('#sheet input.in'); if (f) setTimeout(() => { f.focus(); f.select && f.select(); }, 60); }
function closeSheet() { $('#overlay').classList.remove('open'); }
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeSheet(); });
const goalSVG = `<svg width="48" height="48" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="21" stroke="currentColor" stroke-width="2.5"/><circle cx="24" cy="24" r="13" stroke="currentColor" stroke-width="2.5" opacity=".6"/><circle cx="24" cy="24" r="5" fill="currentColor"/></svg>`;
const eqHTML = (pay, spend, save) => `<div class="eq"><div><div class="v">${fmt(pay)}</div><div class="l">pay</div></div><div class="op">−</div><div><div class="v">${fmt(spend)}</div><div class="l">to spend</div></div><div class="op">=</div><div class="save"><div class="v ${save < 0 ? 'badc' : ''}">${fmt(save)}</div><div class="l">to savings</div></div></div>`;

/* ---------- views ---------- */
function vHome() {
  const bal = balanceNow(), price = S.goal.price || 0, p = projection(), cur = curMonth(), md = monthData(cur);
  const pct = price ? Math.min(100, Math.max(0, bal / price * 100)) : 0;
  let h = '';

  if (!S.started) {
    return `<section class="card"><div class="phone" style="color:var(--accent)">${goalSVG}<div class="grow"><div class="mid">Welcome to Stashday</div><div class="small muted">Plan your month. Send the rest to savings. See which payday gets you there.</div></div></div>
      <label class="f">Currency</label><select class="in" id="ob-cur">${currencyOptions(S.currency)}</select>
      <div class="row" style="gap:8px"><div class="grow"><label class="f">Monthly pay</label><input class="in" id="ob-pay" inputmode="decimal" placeholder="e.g. 700"></div><div style="width:110px"><label class="f">Payday</label><input class="in" id="ob-day" type="number" min="1" max="28" value="${S.payDay}"></div></div>
      <label class="f">Savings you have right now</label><input class="in" id="ob-bal" inputmode="decimal" placeholder="0">
      <label class="f">What are you saving for?</label><input class="in" id="ob-goal" placeholder="e.g. new phone, trip, laptop">
      <div class="row" style="gap:8px"><div class="grow"><label class="f">Price</label><input class="in" id="ob-price" inputmode="decimal" placeholder="optional"></div><div class="grow"><label class="f">Get it by</label><input class="in" id="ob-month" type="month"></div></div>
      <label class="f">This month’s pay</label>
      <div class="row" style="gap:8px"><label class="btn grow" style="justify-content:flex-start;gap:8px"><input type="radio" name="ob-now" value="done" checked> Already got it</label><label class="btn grow" style="justify-content:flex-start;gap:8px"><input type="radio" name="ob-now" value="wait"> Still waiting</label></div>
      <div class="small muted" style="margin-top:10px">Everything stays on this device. No account, nothing sent anywhere.</div>
      <div class="btns"><button class="btn primary" data-act="setup">Start</button></div>
      <div class="small muted" style="text-align:center;margin-top:12px">Used Stashday before? <label style="color:var(--accent);font-weight:600;cursor:pointer">Restore a backup<input type="file" accept="application/json,.json" id="restore" hidden></label></div></section>`;
  }

  // goal
  h += `<section class="card"><div class="phone" style="color:var(--accent)">${goalSVG}<div class="grow"><h2 style="margin:0 0 2px">Saving for</h2><div class="mid" style="color:var(--ink)">${esc(S.goal.name || 'My goal')}</div></div></div>`;
  h += `<div style="margin-top:14px" class="row between"><div><div class="big">${fmt(bal)}</div><div class="muted small">in savings${price ? ' of ' + fmt(price) : ''}</div></div>${price ? `<div style="text-align:right"><div class="mid">${Math.round(pct)}%</div><div class="muted small">${bal >= price ? 'enough!' : fmt(price - bal) + ' to go'}</div></div>` : ''}</div>`;
  if (price) h += `<div class="bar"><i style="width:${pct}%"></i></div>`;
  if (!price) h += `<div class="note warn">Add a price in <b>Settings</b> to see which payday gets you there.</div>`;
  else if (bal >= price) h += `<div class="note ok">🎉 <b>You have enough${S.goal.name ? ' for ' + esc(S.goal.name) : ''}.</b></div>`;
  else if (p.reach) h += `<div class="note ok">You’ll have enough after your <b>${monthName(p.reach)}</b> payday (${shortDate(payDate(p.reach))}).</div>`;
  else h += `<div class="note warn">Not within 3 years at this rate. Try trimming what you plan to spend.</div>`;
  if (price && p.tRow && bal < price) {
    const diff = p.tRow.bal - price;
    const months = Math.max(1, p.rows.findIndex(r => r.k === p.target) + 1);
    h += `<div class="note ${diff >= 0 ? 'ok' : 'warn'}">By your <b>${monthName(p.target)}</b> payday you’ll have about <b>${fmt(p.tRow.bal)}</b> — ${diff >= 0 ? `<b>${fmt(diff)} to spare</b> ✓` : `<b>${fmt(-diff)} short</b>. Plan to spend about ${fmt(-diff / months)} less a month to make it.`}</div>`;
  }
  h += `<div class="tl"><div class="small muted" style="margin:4px 0">Savings after each payday’s transfer</div>`;
  p.rows.slice(0, 8).forEach(r => {
    const tags = [];
    if (r.late) tags.push(`<span class="pill warn">pay late</span>`);
    if (r.done) tags.push(`<span class="pill">sent ✓</span>`);
    if (r.start) tags.push(`<span class="pill muted">today</span>`);
    if (bigIn(r.k)) tags.push(`<span class="pill muted">−${fmt(bigIn(r.k))} trip/plan</span>`);
    if (price && r.bal >= price) tags.push(`<span class="pill">enough</span>`);
    const d = payDate(r.k);
    h += `<div class="r"><span class="lbl">${shortDate(d)}${d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''} ${tags.join('')}</span><b>${fmt(r.bal)}</b></div>`;
  });
  h += `</div></section>`;

  // this month
  const spend = spendOf(cur), toSave = md.pay - spend, sent = sentIn(cur), left = r2(toSave + md.catchUp - sent);
  const due = payDate(cur);
  const late = Math.floor((new Date().setHours(0, 0, 0, 0) - due.getTime()) / 86400000);
  h += `<section class="card"><div class="row between"><h2 style="margin:0">${monthName(cur, { month: 'long' })}</h2><button class="btn" style="padding:6px 10px;font-size:13px" data-go="month">Edit list</button></div>`;
  h += eqHTML(md.pay, spend, toSave);
  if (md.done && sent === 0) {
    h += `<div class="note ok">✓ ${monthName(cur, { month: 'long' })} was already sorted when you started. Stashday tracks from your ${monthName(addMonths(cur, 1), { month: 'long' })} pay.</div>`;
  } else if (!md.received) {
    h += `<div class="note warn">Waiting for pay — due ${shortDate(due)}${late > 0 ? `, <b>${late} day${late > 1 ? 's' : ''} late</b>` : ''}. Paying from savings until it lands is fine — no need to log it. When pay arrives, Stashday tells you how much to put back.</div>`;
    h += `<div class="btns"><button class="btn primary" data-act="payArrived">Pay arrived</button></div>`;
  } else if (left > 0) {
    h += `<div class="note ok">Pay received. Send <b>${fmt(left)}</b> to your savings account${md.catchUp ? ` (${fmt(toSave)} as planned + ${fmt(md.catchUp)} to put back what you paid from savings)` : ''}${sent > 0 ? `, already sent ${fmt(sent)}` : ''}. Your spending account keeps ${fmt(md.pay - toSave - md.catchUp)} for the rest of the month.</div>`;
    h += `<div class="btns"><button class="btn primary" data-act="sent" data-amt="${left}">I sent ${fmt(left)} to savings</button></div>`;
  } else {
    h += `<div class="note ok">✓ Done for ${monthName(cur, { month: 'long' })} — ${fmt(sent)} sent to savings. Your spending account covers the rest.</div>`;
  }
  h += `</section>`;
  return h;
}

function vMonth() {
  const cur = curMonth();
  if (!viewMonth) viewMonth = cur;
  const k = viewMonth, md = monthData(k), spend = spendOf(k);
  let h = `<section class="card"><div class="monthnav"><button data-nav="-1" aria-label="Previous month">‹</button><b>${monthName(k)}</b><button data-nav="1" aria-label="Next month">›</button></div>`;
  if (k !== cur) h += `<div class="small muted" style="text-align:center">${k < cur ? 'Past month' : 'Future month'} · <a href="#" data-act="today" style="color:var(--accent)">back to this month</a></div>`;
  h += eqHTML(md.pay, spend, md.pay - spend);
  h += `<label class="f">Pay this month</label><input class="in" inputmode="decimal" data-mpay="${k}" value="${md.pay || ''}" placeholder="${S.income}">`;
  h += `</section>`;

  h += `<section class="card"><h2>Things I’ll spend on</h2>`;
  if (!md.own) h += `<div class="small muted">Copied from ${Object.keys(S.months).some(x => x < k) ? 'last month' : 'your starter list'}. Changing anything saves it for this month.</div>`;
  md.items.forEach(i => {
    h += `<div class="itemrow"><input class="in em" maxlength="4" data-item="${i.id}" data-k="emoji" value="${esc(i.emoji)}"><input class="in" data-item="${i.id}" data-k="name" value="${esc(i.name)}" placeholder="What for"><input class="in" inputmode="decimal" data-item="${i.id}" data-k="amount" value="${i.amount || ''}" placeholder="0"><button class="x" title="Remove" data-del-item="${i.id}">×</button></div>`;
  });
  if (!md.items.length) h += `<div class="empty">Nothing on the list.</div>`;
  h += `<div class="btns"><button class="btn" data-act="addItem">+ Add item</button></div>`;
  h += `<div id="msum" style="margin-top:14px">${monthSumHTML(k)}</div></section>`;
  h += `<div class="small muted" style="padding:0 4px">Tip: next month starts as a copy of this list, so you only change what’s different.</div>`;
  return h;
}
function monthSumHTML(k) {
  const md = monthData(k), spend = spendOf(k), save = md.pay - spend;
  return `<div class="sum"><span class="muted">Pay</span><span>${fmt(md.pay)}</span></div>
    <div class="sum"><span class="muted">To spend (${md.items.length} item${md.items.length === 1 ? '' : 's'})</span><span>−${fmt(spend)}</span></div>
    <div class="sum total"><span>Send to savings</span><span class="${save >= 0 ? 'good' : 'badc'}">${fmt(save)}</span></div>`;
}

function vSavings() {
  const bal = balanceNow();
  let h = `<section class="card"><h2>Savings account</h2><div class="big">${fmt(bal)}</div>
    <div class="btns"><button class="btn" data-act="move" data-type="add">+ Add money</button><button class="btn" data-act="move" data-type="out">− Take out</button></div>
    <div class="btns" style="margin-top:8px"><button class="btn" data-act="fixBalance">My real balance is different…</button></div></section>`;
  const items = S.moves.map(m => ({ ...m })).sort((a, b) => b.date.localeCompare(a.date) || (b.t || 0) - (a.t || 0));
  h += `<section class="card"><h2>History</h2>`;
  if (!items.length && !S.started) h += `<div class="empty">Nothing yet.</div>`;
  h += `<ul class="list">`;
  items.forEach(m => {
    const plus = m.type !== 'out';
    const label = m.type === 'transfer' ? `${monthName(m.month, { month: 'long' })} transfer` : (m.type === 'add' ? 'Added' : 'Took out');
    const ico = m.type === 'transfer' ? '💸' : (plus ? '⬆️' : '⬇️');
    h += `<li><div class="emoji">${ico}</div><div class="grow"><div class="ttl">${esc(label)}${m.note ? ' · ' + esc(m.note) : ''}</div><div class="small muted">${niceDay(m.date)}</div></div><span class="amt ${plus ? 'plus' : ''}">${plus ? '+' : '−'}${fmt(m.amount)}</span><button class="x" title="Delete" data-del-move="${m.id}">×</button></li>`;
  });
  if (S.started) h += `<li><div class="emoji">🏁</div><div class="grow"><div class="ttl">Starting balance</div>${S.startDate ? `<div class="small muted">${niceDay(S.startDate)}</div>` : ''}</div><span class="amt">${fmt(S.startBalance)}</span><button class="x" title="Edit" data-act="editStart">✎</button></li>`;
  h += `</ul></section>`;
  return h;
}

function vPlan() {
  let h = `<section class="card"><h2>Goal</h2>
    <label class="f">Saving for</label><input class="in" data-f="goal.name" value="${esc(S.goal.name)}" placeholder="e.g. new phone">
    <div class="row" style="gap:8px"><div class="grow"><label class="f">Price</label><input class="in" inputmode="decimal" data-f="goal.price" value="${S.goal.price || ''}" placeholder="shop price"></div><div class="grow"><label class="f">Get it by</label><input class="in" type="month" data-f="goal.targetMonth" value="${esc(S.goal.targetMonth)}"></div></div></section>`;
  h += `<section class="card"><h2>Pay</h2>
    <div class="row" style="gap:8px"><div class="grow"><label class="f">Usual monthly pay</label><input class="in" inputmode="decimal" data-f="income" value="${S.income || ''}"></div><div style="width:110px"><label class="f">Payday</label><input class="in" type="number" min="1" max="28" data-f="payDay" value="${S.payDay}"></div></div></section>`;
  h += `<section class="card"><h2>Big one-off costs</h2><div class="small muted">Things paid out of savings, like a trip. They’re included in the forecast.</div>`;
  S.big.forEach(b => {
    h += `<div class="planrow"><input class="in" data-big="${b.id}" data-k="name" value="${esc(b.name)}" placeholder="What"><input class="in" inputmode="decimal" data-big="${b.id}" data-k="amount" value="${b.amount || ''}" placeholder="0"><input class="in" type="month" data-big="${b.id}" data-k="month" value="${esc(b.month)}"><button class="x" data-del-big="${b.id}">×</button></div>`;
  });
  h += `<div class="btns"><button class="btn" data-act="addBig">+ Add one-off</button></div>
    <div class="small muted" style="margin-top:8px">When you actually pay it, use Savings → Take out and delete it here.</div></section>`;
  h += `<section class="card"><h2>Other</h2>
    <label class="f">Currency</label><select class="in" data-f="currency">${currencyOptions(S.currency)}</select>
    <div class="small muted" style="margin-top:12px">Everything stays in this browser on this device. Nothing is sent anywhere. Back up now and then. Clearing your browser data erases it.</div>
    <div class="btns"><button class="btn" data-act="backup">Back up</button><label class="btn" style="cursor:pointer">Restore<input type="file" accept="application/json,.json" id="restore" hidden></label></div>
    <div class="btns"><button class="btn danger" data-act="reset">Erase everything</button></div></section>
    <div class="small muted" style="text-align:center;padding:4px 0 8px"><a href="/privacy.html" style="color:var(--muted)">Privacy policy</a> · Stashday</div>`;
  return h;
}

function render() {
  if (!loaded) return;
  $('#view').innerHTML = ({ home: vHome, month: vMonth, savings: vSavings, plan: vPlan })[tab]();
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
}
function go(t) { if (!S.started) t = 'home'; tab = t; if (t === 'month') viewMonth = curMonth(); render(); window.scrollTo(0, 0); }

/* ---------- sheets ---------- */
function amountSheet(title, sub, value, act, extra = '') {
  openSheet(`<h3>${title}</h3><div class="muted small">${sub}</div>
    <input class="in amount-in" id="sh-amt" inputmode="decimal" value="${value === '' ? '' : r2(value)}" placeholder="0" style="margin-top:12px">${extra}
    <div class="btns"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="${act}">Save</button></div>`);
}

function payPreview() {
  const el = $('#pa-prev'); if (!el) return;
  const cur = curMonth(), spend = spendOf(cur);
  const pay = num($('#pa-pay').value), cu = Math.max(0, Math.min(num($('#pa-cu').value), spend));
  const send = pay - spend + cu;
  el.innerHTML = `Send <b>${fmt(send)}</b> to savings (${fmt(pay - spend)} planned + ${fmt(cu)} put back). Your spending account keeps <b>${fmt(pay - send)}</b> for the rest of the month’s list.`;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button, a[data-act]'); if (!b) return;
  const d = b.dataset;
  if (b.tagName === 'A') e.preventDefault();
  if (d.tab) return go(d.tab);
  if (d.go) return go(d.go);
  if (d.nav) { viewMonth = addMonths(viewMonth, +d.nav); return render(); }
  if (d.delItem) { const m = ensureMonth(viewMonth); m.items = m.items.filter(i => i.id !== d.delItem); save(); return render(); }
  if (d.delMove) { S.moves = S.moves.filter(m => m.id !== d.delMove); save(); render(); return toast('Deleted'); }
  if (d.delBig) { S.big = S.big.filter(x => x.id !== d.delBig); save(); return render(); }
  const a = d.act; if (!a) return;
  const cur = curMonth();
  switch (a) {
    case 'close': return closeSheet();
    case 'today': viewMonth = cur; return render();
    case 'setup': {
      const pay = num($('#ob-pay').value); if (pay <= 0) { toast('Enter your monthly pay'); return $('#ob-pay').focus(); }
      Object.assign(S, { currency: $('#ob-cur').value, income: pay, payDay: Math.min(28, Math.max(1, Math.round(num($('#ob-day').value)) || 1)),
        startBalance: num($('#ob-bal').value), started: true, startDate: todayISO(), template: GENERIC_LIST.map(i => ({ ...i })) });
      S.goal = { name: $('#ob-goal').value.trim(), price: num($('#ob-price').value), targetMonth: $('#ob-month').value || '' };
      if ((document.querySelector('input[name=ob-now]:checked') || {}).value !== 'wait') { const m = ensureMonth(curMonth()); m.received = true; m.done = true; }
      save(); tab = 'month'; viewMonth = curMonth(); render(); window.scrollTo(0, 0); return toast('Now list what you’ll spend this month');
    }
    case 'editStart': return amountSheet('Starting balance', 'What was in savings when you started.', S.startBalance, 'confirmStart');
    case 'confirmStart': S.startBalance = num($('#sh-amt').value); save(); closeSheet(); return render();
    case 'payArrived': {
      const md = monthData(cur), spend = spendOf(cur);
      const start = payDate(cur), end = payDate(addMonths(cur, 1));
      const frac = Math.min(1, Math.max(0, (Date.now() - start.getTime()) / (end - start)));
      const est = Math.round(spend * frac);
      openSheet(`<h3>${monthName(cur, { month: 'long' })} pay arrived 🎉</h3>
        <label class="f">How much did you get?</label><input class="in" id="pa-pay" inputmode="decimal" value="${md.pay}">
        <label class="f">What’s in your savings account right now?</label><input class="in" id="pa-bal" inputmode="decimal" value="${r2(balanceNow())}">
        <label class="f">How much of this month’s list did you already pay from savings?</label><input class="in" id="pa-cu" inputmode="decimal" value="${est}">
        <div class="small muted" style="margin-top:6px">Things like coffee and gas since ${shortDate(start)}. ${est ? `About ${fmt(est)} if you spent at your usual pace. ` : ''}Extras (games, family, snacks) don’t count. They’re just spent.</div>
        <div class="note ok" id="pa-prev"></div>
        <div class="btns"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="confirmPay">Save</button></div>`);
      payPreview();
      return;
    }
    case 'confirmPay': {
      const pay = num($('#pa-pay').value); if (pay <= 0) return toast('Enter the amount');
      const balV = $('#pa-bal').value, cu = Math.max(0, Math.min(num($('#pa-cu').value), spendOf(cur)));
      if (balV.trim() !== '') { const diff = r2(num(balV) - balanceNow()); if (diff) S.moves.push({ id: uid(), date: todayISO(), t: Date.now() - 1, type: diff > 0 ? 'add' : 'out', amount: Math.abs(diff), note: diff < 0 ? 'Spent while pay was late' : 'Balance correction' }); }
      const m = ensureMonth(cur); m.pay = pay; m.received = true; m.catchUp = cu;
      save(); closeSheet(); render(); return toast('Now send ' + fmt(toSendOf(cur) - sentIn(cur)) + ' to savings');
    }
    case 'sent': return amountSheet('Sent to savings', `How much did you move to your savings account for ${monthName(cur, { month: 'long' })}?`, num(d.amt), 'confirmSent');
    case 'confirmSent': {
      const amt = num($('#sh-amt').value); if (amt <= 0) return toast('Enter the amount');
      ensureMonth(cur).received = true;
      S.moves.push({ id: uid(), date: todayISO(), t: Date.now(), type: 'transfer', amount: amt, month: cur, note: '' });
      save(); closeSheet(); render(); return toast('+' + fmt(amt) + ' to savings 🎉');
    }
    case 'move': {
      const add = d.type === 'add';
      openSheet(`<h3>${add ? 'Add money' : 'Take money out'}</h3><div class="muted small">${add ? 'Money going into savings that isn’t a monthly transfer.' : 'Money leaving savings, e.g. while pay is late, or a trip.'}</div>
        <input class="in amount-in" id="sh-amt" inputmode="decimal" placeholder="0" style="margin-top:12px">
        <div class="row" style="gap:8px"><div class="grow"><label class="f">Note (optional)</label><input class="in" id="sh-note"></div><div style="width:150px"><label class="f">Date</label><input class="in" type="date" id="sh-date" value="${todayISO()}"></div></div>
        <div class="btns"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="confirmMove" data-type="${d.type}">Save</button></div>`);
      return;
    }
    case 'confirmMove': {
      const amt = num($('#sh-amt').value); if (amt <= 0) return toast('Enter an amount');
      S.moves.push({ id: uid(), date: $('#sh-date').value || todayISO(), t: Date.now(), type: d.type, amount: amt, note: $('#sh-note').value.trim() });
      save(); closeSheet(); render(); return toast('Saved');
    }
    case 'fixBalance': return amountSheet('What’s your real balance?', 'Check your savings account. The app adds a correction so the numbers match.', '', 'confirmFix');
    case 'confirmFix': {
      const v = $('#sh-amt').value; if (v.trim() === '') return toast('Enter your real balance');
      const diff = r2(num(v) - balanceNow());
      if (diff) S.moves.push({ id: uid(), date: todayISO(), t: Date.now(), type: diff > 0 ? 'add' : 'out', amount: Math.abs(diff), note: 'Balance correction' });
      save(); closeSheet(); render(); return toast('Balance updated');
    }
    case 'addItem': {
      const m = ensureMonth(viewMonth); m.items.push({ id: uid(), emoji: '🏷️', name: '', amount: 0 }); save(); render();
      const ins = document.querySelectorAll('.itemrow input[data-k="name"]'); const l = ins[ins.length - 1]; if (l) l.focus(); return;
    }
    case 'addBig': { S.big.push({ id: uid(), name: '', amount: 0, month: addMonths(cur, 1) }); save(); render(); const ins = document.querySelectorAll('.planrow input[data-k="name"]'); const l = ins[ins.length - 1]; if (l) l.focus(); return; }
    case 'backup': return backup();
    case 'reset': return openSheet(`<h3>Erase everything?</h3><div class="muted small" style="margin-top:4px">Deletes your lists, savings history and settings on this device. Can’t be undone.</div><div class="btns"><button class="btn" data-act="close">Cancel</button><button class="btn primary" style="background:var(--bad);border-color:var(--bad)" data-act="confirmReset">Erase</button></div>`);
    case 'confirmReset': S = DEFAULT(); save(); closeSheet(); render(); return toast('Erased');
  }
});

document.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (t.id && t.id.startsWith('pa-')) return payPreview();
  if (d.f) {
    let v = ['income', 'goal.price', 'payDay'].includes(d.f) ? num(t.value) : t.value;
    if (d.f === 'payDay') v = Math.min(28, Math.max(1, Math.round(v) || 1));
    if (d.f.startsWith('goal.')) S.goal[d.f.slice(5)] = v; else S[d.f] = v;
    return save();
  }
  if (d.mpay) { ensureMonth(d.mpay).pay = num(t.value); save(); }
  if (d.item) {
    const m = ensureMonth(viewMonth);
    const it = m.items.find(i => i.id === d.item);
    if (it) { it[d.k] = d.k === 'amount' ? num(t.value) : t.value; save(); }
  }
  const ms = $('#msum'); if (ms && viewMonth) ms.innerHTML = monthSumHTML(viewMonth);
  if (tab === 'month') { const eq = document.querySelector('.eq'); if (eq) { const md = monthData(viewMonth), sp = spendOf(viewMonth); eq.outerHTML = eqHTML(md.pay, sp, md.pay - sp); } }
  if (d.big) { const x = S.big.find(b => b.id === d.big); if (x) { x[d.k] = d.k === 'amount' ? num(t.value) : t.value; save(); } }
});
document.addEventListener('change', e => {
  if (e.target.dataset.f === 'currency') render();
  if (e.target.id === 'restore' && e.target.files[0]) restore(e.target.files[0]);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'Enter' && (e.target.id === 'sh-amt' || (e.target.id || '').startsWith('pa-'))) { e.preventDefault(); const p = $('#sheet .btn.primary'); if (p) p.click(); }
});

boot();
</script>
</body>
</html>
